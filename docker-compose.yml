services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: birthdayflow
      POSTGRES_PASSWORD: birthdayflow
      POSTGRES_DB: birthdayflow
    ports:
      - "5432:5432"
    volumes:
      - birthdayflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birthdayflow -d birthdayflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist-api/src/server.js"

volumes:
  birthdayflow_postgres:
